name: Robots meta

# This site must stay out of search engines. GitHub Pages can't send an
# X-Robots-Tag header, so every HTML page has to carry the robots meta tag.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every HTML page has noindex, nofollow, noimageindex
        run: |
          status=0
          while IFS= read -r -d '' f; do
            if ! grep -qE '<meta name="robots" content="noindex, nofollow, noimageindex">' "$f"; then
              echo "::error file=$f::missing <meta name=\"robots\" content=\"noindex, nofollow, noimageindex\">"
              status=1
            fi
          done < <(find . -name '*.html' -not -path './.git/*' -print0)
          exit $status
